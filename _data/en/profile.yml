short_bio: >-
  <p>
    My research focuses on deep learning–based music-driven choreography, which automatically generates dance motion from music.
    It covers three key aspects of generated dance: natural movement, fit with the music’s rhythm and style, and coordination between partners in duet dance.
    I have also studied how human pose information can be used to compress and transmit dance video efficiently.
  </p>

