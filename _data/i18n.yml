# 语言列表与界面文字。新增页面时，在 pages 中登记其路径。
# 英文在根路径 /，中文在 /zh/，日文在 /ja/
languages:
  - code: en
    html_lang: en
    label: EN
    name: English
    prefix: ""
  - code: zh
    html_lang: zh-CN
    label: 中
    name: 中文
    prefix: "/zh"
  - code: ja
    html_lang: ja
    label: 日
    name: 日本語
    prefix: "/ja"

# 页面键 -> 相对路径（各语言共用，前面加上语言前缀）
pages:
  - key: home
    path: "/"
  - key: publications
    path: "/publications/"
  - key: activities
    path: "/activities/"

