{%- include i18n.html -%}
{%- assign news = site.data[lang].news -%}
{% if news and news.size > 0 %}
<section class="section" id="news">
    <h2 class="section-title">{{ T.news }}</h2>
    <ul class="news list-unstyled mb-0">
        {% for item in news limit: include.limit %}
        <li class="news-item">
            <span class="news-date">{{ item.date }}</span>
            <span class="news-text">{{ item.text }}</span>
        </li>
        {% endfor %}
    </ul>
</section>
{% endif %}
